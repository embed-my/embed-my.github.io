<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Embed My player</title>
    <script type="module" src="/src/h5p-page.ts"></script>
  </head>

  <body>
    <!-- The markup @missing-elements/h5p-embed's page expects: shown before any script runs, since
         the first seconds go to the worker and the package's index. -->
    <div class="loader" id="loader" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span class="loader-text">Loading…</span>
    </div>
    <h5p-player auto-resize></h5p-player>
    <p class="notice" id="notice" hidden></p>
  </body>
</html>
